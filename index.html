<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BrandPilot AI</title>
<style>
:root{--bg:#f7f7fb;--cd:#fff;--tx:#17172b;--mu:#6b6b85;--bd:#e6e6f0;--pr:#6d5efc;--pl:#efedff;--pk:#ec4899;--ok:#16a34a;--wa:#d97706;--cr:#dc2626;--un:#64748b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f1a;--cd:#181826;--tx:#ececf8;--mu:#9a9ab5;--bd:#2a2a3e;--pl:#26244a;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0 0 8px;line-height:1.2}h1{font-size:34px}h2{font-size:22px}h3{font-size:15px}p{margin:0 0 10px}.mu{color:var(--mu)}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:.15s}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--cr)}.btn.s{padding:6px 11px;font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,20,60,.05)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}input,select,textarea{width:100%;background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
.app{display:flex;min-height:100%}.side{width:230px;background:var(--cd);border-right:1px solid var(--bd);padding:16px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:18px;margin-bottom:16px;cursor:pointer}.logo b{color:var(--pr)}
.nv{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:600;margin-bottom:2px}.nv:hover{background:var(--pl)}.nv.on{background:var(--pl);color:var(--pr)}
.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--cd);gap:10px;flex-wrap:wrap}.pg{padding:24px;max-width:1100px;margin:0 auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pl);color:var(--pr)}
.secure,.published,.approved{background:#16a34a22;color:var(--ok)}.warning,.pending_approval,.scheduled{background:#d9770622;color:var(--wa)}.critical,.rejected,.failed{background:#dc262622;color:var(--cr)}.unknown,.draft{background:#64748b22;color:var(--un)}.demo{background:#ec489922;color:var(--pk)}
.stat{font-size:28px;font-weight:800}.drop{border:2px dashed var(--bd);border-radius:14px;padding:26px;text-align:center;cursor:pointer}.drop.h{border-color:var(--pr);background:var(--pl)}
.th{position:relative;width:96px}.th img,.th video{width:96px;height:96px;object-fit:cover;border-radius:10px}.th button{position:absolute;top:2px;right:2px;border:0;border-radius:99px;cursor:pointer}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pk));transition:.4s}
.ig{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--cd);max-width:380px}.ig .h{padding:10px;display:flex;gap:8px;align-items:center;font-weight:700}.av{width:30px;height:30px;border-radius:99px;background:linear-gradient(135deg,var(--pr),var(--pk));color:#fff;display:grid;place-items:center;font-size:12px}
.ig .m{aspect-ratio:1;background:var(--pl);display:grid;place-items:center;color:var(--mu);text-align:center;padding:10px}.ig .m img,.ig .m video{width:100%;height:100%;object-fit:cover}.ig .c{padding:10px;white-space:pre-wrap}.hs{color:var(--pr)}
.ban{background:#ec489914;border:1px solid #ec489944;border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17172b;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;display:none}
.hero{text-align:center;padding:70px 20px 40px;max-width:760px;margin:0 auto}.hero h1{font-size:clamp(28px,6vw,48px)}
.step{padding:6px 0;border-bottom:1px solid var(--bd)}.uns{opacity:.5}
:root{--pr:#7c3aed}.btn{background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 4px 12px #7c3aed33}.btn.g{background:var(--cd);box-shadow:none}.btn.d{background:var(--cr)}.card{border-radius:18px;transition:.2s}.card:hover{box-shadow:0 8px 24px #7c3aed1a}.side{background:linear-gradient(180deg,#2e1065,#4c1d95);border:0}.side .logo{color:#fff}.side .logo b{color:#f9a8d4}.nv{color:#ddd6fe}.nv:hover{background:#ffffff1f}.nv.on{background:#fff;color:#6d28d9}.sc{color:#fff;border:0}.sc .mu{color:#ffffffcc}.c1{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.c2{background:linear-gradient(135deg,#f59e0b,#fbbf24)}.c3{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}.c4{background:linear-gradient(135deg,#10b981,#34d399)}.c5{background:linear-gradient(135deg,#ec4899,#f472b6)}.hero h1 span{background:linear-gradient(90deg,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{position:relative}.glow{position:absolute;inset:0;z-index:-1;background:radial-gradient(600px 300px at 50% 0,#6d5efc33,transparent),radial-gradient(400px 250px at 80% 20%,#ec489926,transparent)}.feat{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center}.ring i{width:84px;height:84px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:26px}
@media(max-width:800px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;overflow-x:auto;gap:4px;padding:8px}.logo{display:none}.nv{white-space:nowrap;width:auto}.pg{padding:14px}.top{padding:10px 14px}}
</style></head><body><div id="root"></div><div id="toast" role="status"></div>
<script>
/* ===== Config: set USE_MOCK=false and API_BASE to call the real FastAPI backend (see api object) ===== */
const USE_MOCK=true,API_BASE="http://localhost:8000/api/v1",MAX_MB=50,OKT=["image/jpeg","image/png","image/webp","video/mp4","video/quicktime"];
const TZS=["Asia/Karachi","UTC","Asia/Dubai","Europe/London","America/New_York","Asia/Kolkata"];
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={view:"landing",biz:{business_name:"",instagram_username:"",category:"Fashion",description:"",tone:"Friendly",target_audience:"",language:"English",timezone:"Asia/Karachi",instagram_connected:false,brand_colors:["#6d5efc","#ec4899"]},items:[],notes:[],sec:{last:null,checks:null},step:1,filter:"all",demo:true};
try{const j=localStorage.getItem("bp");if(j){const o=JSON.parse(j);S={...S,...o,view:S.view};S.items.forEach(i=>i.media.forEach(m=>m.url=""))}}catch(e){}
const save=()=>{try{localStorage.setItem("bp",JSON.stringify({biz:S.biz,items:S.items,notes:S.notes,sec:S.sec,demo:S.demo}))}catch(e){}};
let files=[],cur=null,busy=false;
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)};
const note=(type,title,message)=>{S.notes.unshift({id:"n"+Date.now()+Math.random(),type,title,message,created_at:new Date().toISOString(),read:false});save()};
const bn=()=>S.biz.business_name||"Your Brand";
/* ===== Mock API (same shapes as the backend contract) ===== */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const api={
 async generate(req,media){if(!USE_MOCK){const r=await fetch(API_BASE+"/content/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(req)});if(!r.ok)throw new Error((await r.json()).detail||"Request failed");return(await r.json()).content}
  await wait(500);const p=req.product_name,pr=req.price?` Only ${req.currency} ${req.price}${req.discount?" ("+req.discount+" off)":""}.`:"";
  const open={sales:"Ready to upgrade? ",awareness:"Meet ",engagement:"Quick question: ",launch:"Just dropped: "}[req.objective];
  const tag=w=>"#"+w.replace(/[^a-z0-9]/gi,"");
  const it={id:"c"+Date.now(),status:"pending_approval",media,product_name:p,post_type:req.post_type,caption:`${open}${p} ✨\n${req.description}${pr}\nMade for ${req.target_audience||"you"}.`,hashtags:[tag(p),tag(S.biz.category||"brand"),"#SmallBusiness","#InstagramMarketing","#Pakistan"],cta:req.objective==="sales"?"Tap the link in bio to order today":"Follow for more and send us a DM",content_rationale:`Tone set to ${req.tone}. Opens with a hook, states the benefit, ends with one clear call to action for the ${req.objective} goal.`,reel_hook:req.post_type==="reel"?`Wait until you see what ${p} can do…`:null,reel_script:req.post_type==="reel"?`0-3s: hook. 3-10s: show ${p} in use. 10-15s: price/offer and CTA.`:null,carousel_slides:req.post_type==="carousel"?["Slide 1: hook with product","Slide 2: key benefit","Slide 3: specs / price","Slide 4: call to action"]:[],preview_url:null,scheduled_at:null,published_at:null,created_at:new Date().toISOString()};return it},
 async publish(it){await wait(500);if(!USE_MOCK){const r=await fetch(API_BASE+"/content/"+it.id+"/publish",{method:"POST"});if(!r.ok)throw new Error((await r.json()).detail||"Publishing failed");return r.json()}
  return{mode:"demo",message:"Simulated publish (Demo Mode). Nothing was sent to Instagram."}}
};
const chk=(id,title,status,verification,description,recommendation)=>({id,title,status,verification,description,recommendation});
const baseChecks=()=>[["2fa","Two-factor authentication review"],["pw","Password hygiene review"],["rec","Recovery settings review"],["log","Login activity review"],["apps","Connected apps review"],["breach","Potential email breach exposure"],["perm","Account permission review"]].map(([i,t])=>chk(i,t,"unknown","manual_review","Not verified. Instagram does not expose this setting to this app.","Review this manually in Instagram: Settings → Accounts Center → Password and security."));
function runScan(){S.sec.last=new Date().toISOString();const d={"2fa":["warning","Two-factor authentication has not been confirmed. Review your Instagram security settings."],"rec":["warning","Recovery email/phone could not be confirmed."],"apps":["warning","Sample finding: 3 connected apps flagged for review."],"perm":["secure","Sample finding: only this app has publishing permission."]};
 S.sec.checks=baseChecks().map(c=>d[c.id]?{...c,status:d[c.id][0],verification:"demo",description:d[c.id][1],recommendation:"Open Instagram → Settings and confirm this manually."}:c);
 note("security_complete","Security assessment complete","Sample Security Assessment finished (Demo Mode).");note("security_advisory","Security advisory","Two-factor authentication has not been confirmed. Review your Instagram security settings.");save()}
const overall=()=>{const c=S.sec.checks||[];return c.some(x=>x.status==="critical")?"critical":c.some(x=>x.status==="warning")?"warning":c.length&&c.every(x=>x.status==="secure")?"secure":"unknown"};
/* ===== Components ===== */
const tag=(s,l)=>`<span class="tag ${s}">${esc(l||s.replace("_"," "))}</span>`;
const fmt=(d,tz)=>d?new Date(d).toLocaleString([],{timeZone:tz||S.biz.timezone,dateStyle:"medium",timeStyle:"short"}):"—";
function media(m){if(!m||!m.url)return"<span>Media preview unavailable<br>(re-upload after reload)</span>";return m.media_type==="video"?`<video src="${m.url}" controls muted></video>`:`<img src="${m.url}" alt="${esc(m.filename)}">`}
function ig(it){const u=S.biz.instagram_username||bn();return`<div class="ig"><div class="h"><div class="av">${esc(bn()[0])}</div>@${esc(u)}</div><div class="m">${it.preview_url?`<img src="${it.preview_url}" alt="">`:media(it.media[0])}</div><div class="c">${esc(it.caption)}\n\n<span class="hs">${it.hashtags.map(esc).join(" ")}</span>\n\n<b>${esc(it.cta)}</b></div></div>`}
function card(it,full){const st=it.status,a=[];
 if(["draft","pending_approval"].includes(st))a.push(["approve","Approve",""],["reject","Reject","d"]);
 if(["draft","pending_approval","approved"].includes(st))a.push(["edit","Edit caption","g"]);
 a.push(["regen","Regenerate","g"],["copy","Copy caption","g"]);
 if(st==="approved")a.push(["publish","Publish now",""],["cal","Schedule","g"]);
 if(st==="scheduled")a.push(["cancel","Cancel schedule","g"]);
 return`<div class="card"><div class="row sp"><h3>${esc(it.product_name)}</h3><div class="row">${tag(it.post_type)}${tag(st)}</div></div><div class="row" style="align-items:flex-start;margin-top:10px">${ig(it)}<div style="flex:1;min-width:220px">
 <p class="mu">${esc(it.content_rationale||"")}</p>${it.reel_hook?`<p><b>Reel hook:</b> ${esc(it.reel_hook)}</p><p><b>Script:</b> ${esc(it.reel_script)}</p>`:""}${(it.carousel_slides||[]).map(s=>`<div class="step">${esc(s)}</div>`).join("")}
 <p class="mu" style="font-size:12px">Layout shown is the uploaded media with generated text. No rendered image or video was produced.</p>
 ${it.scheduled_at?`<p>Scheduled: ${fmt(it.scheduled_at)} (${esc(S.biz.timezone)})</p>`:""}${it.published_at?`<p>${tag("demo","Simulated publish")} ${fmt(it.published_at)}</p>`:""}
 <div class="row">${a.map(x=>`<button class="btn s ${x[2]}" data-a="${x[0]}" data-id="${it.id}">${x[1]}</button>`).join("")}</div></div></div></div>`}
const item=id=>S.items.find(i=>i.id===id);
async function act(a,id){const it=item(id);if(!it)return;
 if(a==="approve"){it.status="approved";note("awaiting","Post approved",it.product_name+" is ready to schedule or publish.");toast("Approved")}
 else if(a==="reject"){it.status="rejected";toast("Draft rejected")}
 else if(a==="copy"){try{await navigator.clipboard.writeText(it.caption+"\n\n"+it.hashtags.join(" "));toast("Caption copied")}catch(e){toast("Copy blocked by browser")}return}
 else if(a==="edit"){const v=prompt("Edit caption",it.caption);if(v===null)return;if(!v.trim())return toast("Caption cannot be empty");it.caption=v;if(it.status==="approved")it.status="pending_approval";toast("Caption updated")}
 else if(a==="regen"){const r=await api.generate({product_name:it.product_name,description:it.caption.split("\n")[1]||"",objective:"engagement",post_type:it.post_type,tone:S.biz.tone,language:S.biz.language,media_ids:[]},it.media);Object.assign(it,{caption:r.caption+" ",hashtags:r.hashtags,cta:r.cta,status:"pending_approval"});toast("Regenerated")}
 else if(a==="publish"){if(it.status!=="approved")return toast("Only approved posts can be published");it.status="publishing";render();try{const r=await api.publish(it);it.status="published";it.published_at=new Date().toISOString();note("publish","Publishing result",r.message);toast(r.message)}catch(e){it.status="failed";note("publish","Publishing failed",e.message);toast("Publishing failed: "+e.message)}}
 else if(a==="cancel"){it.status="approved";it.scheduled_at=null;toast("Schedule cancelled")}
 else if(a==="cal"){go("cal");return}
 save();if(S.view==="studio"&&$("#res")){$("#res").innerHTML=resHtml(it);bind()}else render()}
/* ===== Views ===== */
const NAV=[["dash","🏠 Dashboard"],["studio","✨ AI Content Studio"],["content","🗂️ My Content"],["cal","📅 Content Calendar"],["sec","🛡️ Security Guardian"],["notif","🔔 Notifications"],["set","⚙️ Settings"]];
const go=v=>{S.view=v;render();scrollTo(0,0)};
const V={
landing:()=>`<div class="top"><div class="logo" style="margin:0">Brand<b>Pilot</b> AI</div><div class="row"><button class="btn g s" data-go="dash">Explore Dashboard</button><button class="btn s" data-go="onboard">Get Started</button></div></div>
<div class="hero"><div class="glow"></div><span class="tag">AI Instagram Manager</span><h1 style="margin-top:12px">Your AI-Powered <span>Instagram Manager</span> &amp; Security Guardian</h1><p class="mu">Upload your product media, get captions, hashtags and calls to action, approve them, then schedule. Plus an honest security checkup for your account.</p><div class="row" style="justify-content:center"><button class="btn" data-go="onboard">Get Started</button><button class="btn g" data-go="dash">Explore Dashboard</button></div><div class="ig" style="margin:30px auto 0;text-align:left"><div class="h"><div class="av">B</div>@yourbrand <span class="tag demo">Sample preview</span></div><div class="m" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:700;font-size:22px">New drop ✨</div><div class="c">Ready to upgrade? Meet our new collection.
<span class="hs">#SmallBusiness #Pakistan</span></div></div></div>
<div class="pg"><div class="grid g4">${[["1. Upload","Add photos or videos and product details."],["2. Generate","AI drafts caption, hashtags, CTA and Reel ideas."],["3. Approve &amp; Publish","Edit, approve, then schedule or publish."]].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join("")}</div>
<h2 style="margin:26px 0 12px;text-align:center">Everything your brand needs</h2><div class="feat">${[["Smart captions","Hook, benefit and CTA tuned to your tone and language."],["Reel &amp; carousel planner","Hooks, scripts and slide-by-slide ideas."],["Approval workflow","Draft, edit, approve. Nothing posts without you."],["Timezone-aware scheduler","Plan ahead with an explicit timezone."],["Security Guardian","Honest account-safety checkups."],["Notifications","Stay on top of approvals and advisories."]].map((x,i)=>`<div class="card"><div style="font-size:26px">${["✍️","🎬","✅","🕒","🛡️","🔔"][i]}</div><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join("")}</div><div class="card" style="margin-top:14px"><h2>Security Guardian</h2><p class="mu">Reviews 2FA, passwords, recovery settings, login activity, connected apps and email exposure. Anything Instagram does not expose is shown as Unknown, never guessed.</p><button class="btn g" data-go="sec">See Security Guardian</button></div>
<p class="mu" style="text-align:center;margin-top:30px">© BrandPilot AI · Hackathon build · Demo Mode</p></div>`,
onboard:()=>{const b=S.biz,s=S.step;return`<div class="pg" style="max-width:620px"><h2>Set up your business (${s}/3)</h2><div class="bar"><i style="width:${s*33.3}%"></i></div><div class="card" style="margin-top:14px">`+(s===1?`<label for="bn">Business name *</label><input id="bn" value="${esc(b.business_name)}"><label for="iu">Instagram username *</label><input id="iu" value="${esc(b.instagram_username)}" placeholder="yourbrand"><label for="ct">Category</label><select id="ct">${["Fashion","Food","Beauty","Electronics","Services","Other"].map(x=>`<option ${x===b.category?"selected":""}>${x}</option>`).join("")}</select><label for="ds">Short description *</label><textarea id="ds" rows="3">${esc(b.description)}</textarea>`:s===2?`<label for="lg">Brand logo</label><input id="lg" type="file" accept="image/*"><label for="c1">Brand colors</label><div class="row"><input id="c1" type="color" value="${b.brand_colors[0]}" style="width:60px"><input id="c2" type="color" value="${b.brand_colors[1]}" style="width:60px"></div><label for="tn">Tone</label><select id="tn">${["Professional","Friendly","Trendy","Luxury","Minimal"].map(x=>`<option ${x===b.tone?"selected":""}>${x}</option>`).join("")}</select><label for="ta">Target audience</label><input id="ta" value="${esc(b.target_audience)}"><label for="lc">Content language</label><select id="lc">${["English","Urdu","Roman Urdu"].map(x=>`<option ${x===b.language?"selected":""}>${x}</option>`).join("")}</select>`:`<h3>Connect Instagram</h3><p class="mu">We never ask for your Instagram password. Real connection uses Meta’s official authorization and needs the backend.</p><div class="row"><button class="btn" id="demo">Continue in Demo Mode</button><button class="btn g" id="conn">Connect Instagram</button></div>`)+`</div><div class="row sp" style="margin-top:14px"><button class="btn g" id="bk" ${s===1?"disabled":""}>Back</button>${s<3?'<button class="btn" id="nx">Next</button>':""}</div></div>`},
dash:()=>{const I=S.items,c=x=>I.filter(i=>i.status===x).length,up=I.filter(i=>i.status==="scheduled").sort((a,b)=>a.scheduled_at>b.scheduled_at?1:-1);
 return`${ban()}<div class="row sp"><div><h2>Welcome, ${esc(bn())}</h2><p class="mu">Here is your content overview.</p></div><button class="btn" data-go="studio">+ Create New Post</button></div>
<div class="grid g4" style="margin:14px 0">${[["Content created",I.length],["Pending approval",c("pending_approval")],["Scheduled",c("scheduled")],["Published",c("published")]].map((x,i)=>`<div class="card sc c${i+1}"><div class="mu">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join("")}<div class="card sc c5"><div class="mu">Security status</div><div style="margin-top:8px">${tag(overall())}</div></div></div>
<div class="card" style="margin-bottom:14px"><h3>🚀 Get started in 4 easy steps</h3><div class="row">${[["Upload media","studio",S.items.length],["Generate with AI","studio",S.items.length],["Approve","content",S.items.some(i=>["approved","scheduled","published"].includes(i.status))],["Schedule","cal",S.items.some(i=>["scheduled","published"].includes(i.status))]].map((s,i)=>`<button class="btn s ${s[2]?"":"g"}" data-go="${s[1]}">${s[2]?"✓":i+1}. ${s[0]}</button>`).join("")}</div></div><div class="grid g2" style="margin-bottom:14px"><div class="card"><div class="row sp"><h3>Weekly reach</h3>${tag("demo","Sample data")}</div>${chart()}</div><div class="card"><h3>Security score</h3>${ring()}</div></div><div class="grid g2"><div class="card"><h3>Recent generated content</h3>${I.length?I.slice(0,4).map(i=>`<div class="step row sp"><span>${esc(i.product_name)}</span>${tag(i.status)}</div>`).join(""):empty("No content yet. Create your first post.")}</div>
<div class="card"><h3>Upcoming scheduled</h3>${up.length?up.slice(0,4).map(i=>`<div class="step row sp"><span>${esc(i.product_name)}</span><span class="mu">${fmt(i.scheduled_at)}</span></div>`).join(""):empty("Nothing scheduled.")}</div>
<div class="card"><h3>Security alerts</h3>${S.sec.checks?S.sec.checks.filter(c=>c.status!=="secure"&&c.status!=="unknown").map(c=>`<div class="step">${tag(c.status)} ${esc(c.description)}</div>`).join(""):empty("No assessment run yet.")}<button class="btn g s" data-go="sec" style="margin-top:8px">Open Security Guardian</button></div></div>`},
studio:()=>{const b=S.biz;return`${ban()}<h2>AI Content Studio</h2><div class="grid g2"><div class="card"><h3>A. Media upload</h3><div class="drop" id="dz" tabindex="0" role="button" aria-label="Upload media"><p><b>Drag and drop</b> or click to browse</p><p class="mu">JPG, PNG, WEBP, MP4, MOV · max ${MAX_MB} MB each. Instagram may need conversion for some files.</p></div><input id="fi" type="file" multiple hidden accept=".jpg,.jpeg,.png,.webp,.mp4,.mov"><div id="fl" class="row" style="margin-top:10px"></div></div>
<div class="card"><h3>B. Content information</h3><label for="pn">Product/service name *</label><input id="pn"><label for="pd">Description *</label><textarea id="pd" rows="3"></textarea><div class="row"><div style="flex:1"><label for="pp">Price</label><input id="pp" type="number" min="0"></div><div style="width:90px"><label for="cu">Currency</label><select id="cu"><option>PKR</option><option>USD</option><option>AED</option></select></div><div style="flex:1"><label for="dc">Discount</label><input id="dc" placeholder="20%"></div></div><label for="ta">Target audience</label><input id="ta" value="${esc(b.target_audience)}">
<div class="row"><div style="flex:1"><label for="ob">Objective</label><select id="ob"><option value="sales">Sales</option><option value="awareness">Awareness</option><option value="engagement">Engagement</option><option value="launch">Product Launch</option></select></div><div style="flex:1"><label for="pt">Post type</label><select id="pt"><option value="feed">Feed Post</option><option value="carousel">Carousel</option><option value="reel">Reel</option><option value="story">Story Concept</option></select></div></div>
<div class="row"><div style="flex:1"><label for="tn">Tone</label><select id="tn">${["Professional","Friendly","Trendy","Luxury","Minimal"].map(x=>`<option ${x===b.tone?"selected":""}>${x}</option>`).join("")}</select></div><div style="flex:1"><label for="lc">Language</label><select id="lc">${["English","Urdu","Roman Urdu"].map(x=>`<option ${x===b.language?"selected":""}>${x}</option>`).join("")}</select></div></div><label for="in">Additional instructions</label><textarea id="in" rows="2"></textarea><button class="btn" id="gen" style="margin-top:12px">Generate with AI</button></div></div><div id="res" style="margin-top:14px"></div>`},
content:()=>{const f=S.filter,L=S.items.filter(i=>f==="all"||i.status===f);return`<div class="row sp"><h2>My Content</h2><select id="ff" style="width:180px" aria-label="Filter">${["all","pending_approval","approved","scheduled","published","rejected","failed"].map(x=>`<option ${x===f?"selected":""}>${x}</option>`).join("")}</select></div><div class="grid" style="margin-top:12px">${L.length?L.map(i=>card(i)).join(""):empty("No content here yet.")}</div>`},
cal:()=>{const ap=S.items.filter(i=>i.status==="approved"),sc=S.items.filter(i=>i.status==="scheduled").sort((a,b)=>a.scheduled_at>b.scheduled_at?1:-1),g={};sc.forEach(i=>{const k=new Date(i.scheduled_at).toLocaleDateString([],{timeZone:S.biz.timezone,dateStyle:"full"});(g[k]=g[k]||[]).push(i)});
 return`${ban()}<h2>Content Calendar</h2><div class="grid g2"><div class="card"><h3>Schedule an approved post</h3>${ap.length?`<label for="sp">Post</label><select id="sp">${ap.map(i=>`<option value="${i.id}">${esc(i.product_name)}</option>`).join("")}</select><label for="sd">Date and time</label><input id="sd" type="datetime-local"><label for="stz">Timezone</label><select id="stz">${TZS.map(z=>`<option ${z===S.biz.timezone?"selected":""}>${z}</option>`).join("")}</select><div class="row" style="margin-top:12px"><button class="btn" id="sch">Schedule</button><button class="btn g" id="pn2">Publish now</button></div><p class="mu" style="font-size:12px">Sent as ISO 8601 with UTC offset. Demo Mode publishing is simulated.</p>`:empty("Approve a post first. Only approved posts can be scheduled.")}</div>
<div class="card"><h3>Scheduled posts</h3>${Object.keys(g).length?Object.entries(g).map(([d,l])=>`<p><b>${d}</b></p>${l.map(i=>`<div class="step row sp"><span>${esc(i.product_name)} · ${fmt(i.scheduled_at)}</span><button class="btn g s" data-a="cancel" data-id="${i.id}">Cancel Schedule</button></div>`).join("")}`).join(""):empty("Nothing scheduled yet.")}</div></div>`},
sec:()=>{const c=S.sec.checks||baseChecks();return`<div class="row sp"><div><h2>Security Guardian — Protect Your Instagram Presence</h2><p class="mu">Overall: ${tag(overall())} · Last assessment: ${S.sec.last?fmt(S.sec.last):"never"} · Next scheduled: not supported in this build</p></div><button class="btn" id="scan">Run Security Assessment</button></div>
<div class="ban">${S.sec.checks?"<b>Sample Security Assessment</b> · demonstration findings only, not real data about your account.":"No verified assessment yet. Items below are Unknown until verified. Instagram does not expose these settings to this app."}</div>
<div class="card" style="margin-bottom:14px"><h3>Security score</h3>${ring()}</div><div class="grid g2">${c.map(x=>`<div class="card"><div class="row sp"><h3>${esc(x.title)}</h3>${tag(x.status)}</div><p class="mu">${esc(x.description)}</p><p>${tag(x.verification==="demo"?"demo":"unknown",{integration:"Verified via integration",user_reported:"User reported",manual_review:"Recommended manual check",demo:"Demo-only simulated finding"}[x.verification])}</p><p style="font-size:13px">${esc(x.recommendation||"")}</p></div>`).join("")}</div>
<div class="card" style="margin-top:14px"><h3>Check history</h3>${S.notes.filter(n=>n.type==="security_complete").map(n=>`<div class="step">${fmt(n.created_at)} · ${esc(n.message)}</div>`).join("")||empty("No checks run yet.")}</div>`},
notif:()=>{const L={generated:"Content generated",awaiting:"Post awaiting approval",scheduled:"Post scheduled",publish:"Publishing successful/failed",security_advisory:"Security advisory",security_complete:"Security assessment complete"};return`<div class="row sp"><h2>Notifications</h2><button class="btn g s" id="mr">Mark all read</button></div>${Object.entries(L).map(([k,l])=>{const n=S.notes.filter(x=>x.type===k);return n.length?`<div class="card" style="margin-top:12px"><h3>${l}</h3>${n.map(x=>`<div class="step" style="${x.read?"":"font-weight:700"}">${x.read?"":"● "}${esc(x.title)} <span class="mu">· ${esc(x.message)} · ${fmt(x.created_at)}</span></div>`).join("")}</div>`:""}).join("")||empty("You’re all caught up.")}`},
set:()=>{const b=S.biz;return`${ban()}<h2>Settings</h2><div class="grid g2"><div class="card"><h3>Business &amp; brand</h3><label for="bn">Business name</label><input id="bn" value="${esc(b.business_name)}"><label for="iu">Instagram username</label><input id="iu" value="${esc(b.instagram_username)}"><label for="tn">Tone</label><select id="tn">${["Professional","Friendly","Trendy","Luxury","Minimal"].map(x=>`<option ${x===b.tone?"selected":""}>${x}</option>`).join("")}</select><label for="tz">Default timezone</label><select id="tz">${TZS.map(z=>`<option ${z===b.timezone?"selected":""}>${z}</option>`).join("")}</select><button class="btn" id="sv" style="margin-top:12px">Save settings</button></div>
<div class="card"><h3>Connection &amp; privacy</h3><p>Instagram: ${tag(b.instagram_connected?"approved":"unknown",b.instagram_connected?"Connected":"Not connected")}</p><p>Mode: ${tag("demo","Demo Mode")}</p><p class="mu">This app never asks for your Instagram password and holds no API keys or tokens in the browser. Notification and assessment preferences are stored locally.</p><button class="btn d s" id="rs">Reset demo data</button></div></div>`}};
const chart=()=>{const d=[40,65,52,80,74,96,88];return`<svg viewBox="0 0 280 118" style="width:100%" role="img" aria-label="Sample weekly reach"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>${d.map((v,i)=>`<rect x="${i*40+8}" y="${100-v}" width="26" height="${v}" rx="6" fill="url(#gg)"/><text x="${i*40+21}" y="114" font-size="9" text-anchor="middle" fill="currentColor">${"MTWTFSS"[i]}</text>`).join("")}</svg>`};
const ring=()=>{const p={secure:100,warning:60,critical:25}[overall()];return`<div class="row"><div class="ring" style="background:conic-gradient(var(--pr) ${p||0}%,var(--bd) 0)"><i>${p??"?"}</i></div><p class="mu" style="flex:1">${p?"Sample score from the demo assessment.":"Run an assessment. The score stays unknown until checks are verified."}</p></div>`};
const resHtml=it=>`<h3>D. Generated result</h3>${card(it)}<div class="card" style="margin-top:10px"><h3>A/B caption variants</h3><div class="row">${[["short","Short &amp; punchy"],["playful","Playful"],["premium","Premium"]].map(v=>`<button class="btn g s" data-v="${v[0]}" data-id="${it.id}">${v[1]}</button>`).join("")}</div><p class="mu" style="font-size:12px">General guidance: evenings often work well, so test 7–9 PM. This is not based on your account data.</p></div><div class="row" style="margin-top:10px"><button class="btn g s" data-go="content">View in My Content</button></div>`;
const empty=t=>`<p class="mu" style="padding:14px 0">${t}</p>`;
const ban=()=>`<div class="ban">${tag("demo","Demo Mode")} Sample data and simulated actions. Nothing is sent to Instagram.</div>`;
function render(){const r=$("#root"),v=S.view;if(v==="landing"||v==="onboard"){r.innerHTML=V[v]();bind();return}
 const un=S.notes.filter(n=>!n.read).length;
 r.innerHTML=`<div class="app"><aside class="side"><div class="logo" data-go="landing">Brand<b>Pilot</b> AI</div><button class="btn" style="width:100%;margin-bottom:12px" data-go="studio">+ Create Content</button>${NAV.map(n=>`<button class="nv ${v===n[0]?"on":""}" data-go="${n[0]}">${n[1]}</button>`).join("")}</aside><div class="main"><div class="top"><b>${esc(bn())}</b><div class="row">${tag(S.biz.instagram_connected?"approved":"demo",S.biz.instagram_connected?"Connected":"Demo Mode")}<button class="btn g s" data-go="notif">🔔 ${un}</button><div class="av">${esc(bn()[0])}</div></div></div><div class="pg">${V[v]()}</div></div></div>`;bind()}
/* ===== Events ===== */
const val=id=>($("#"+id)||{}).value;
function addFiles(list){[...list].forEach(f=>{const ext=f.name.split(".").pop().toLowerCase(),ok=OKT.includes(f.type)||["jpg","jpeg","png","webp","mp4","mov"].includes(ext);
 if(!ok)return toast(`${f.name}: unsupported type`);if(f.size>MAX_MB*1048576)return toast(`${f.name}: larger than ${MAX_MB} MB`);
 files.push({id:"m"+Date.now()+Math.random(),filename:f.name,media_type:f.type.startsWith("video")||ext==="mov"?"video":"image",url:URL.createObjectURL(f),mime_type:f.type,size_bytes:f.size})});drawFiles()}
function drawFiles(){const e=$("#fl");if(!e)return;e.innerHTML=files.map((m,i)=>`<div><div class="th">${m.media_type==="video"?`<video src="${m.url}" muted></video>`:`<img src="${m.url}" alt="">`}<button data-rm="${i}" aria-label="Remove ${esc(m.filename)}">×</button></div><div class="mu" style="font-size:11px;width:96px;overflow:hidden;text-overflow:ellipsis">${esc(m.filename)}<br>${(m.size_bytes/1048576).toFixed(1)} MB</div><div class="bar"><i style="width:100%"></i></div></div>`).join("")}
async function generate(){if(busy)return;const pn=val("pn").trim(),pd=val("pd").trim();if(!pn||!pd)return toast("Product name and description are required");if(!files.length)return toast("Upload at least one image or video");
 busy=true;const res=$("#res"),steps=["Uploading media","Analyzing content","Generating marketing copy","Preparing post preview","Completing draft"];
 for(let i=0;i<steps.length;i++){res.innerHTML=`<div class="card"><h3>Working…</h3><div class="bar"><i style="width:${(i+1)*20}%"></i></div>${steps.map((s,j)=>`<div class="step ${j>i?"uns":""}">${j<i?"✓":j===i?"⏳":"○"} ${s}</div>`).join("")}<p class="mu" style="font-size:12px">Progress is illustrative.</p></div>`;await wait(450)}
 try{const it=await api.generate({media_ids:files.map(f=>f.id),product_name:pn,description:pd,price:val("pp")?+val("pp"):null,currency:val("cu"),discount:val("dc"),target_audience:val("ta"),objective:val("ob"),post_type:val("pt"),tone:val("tn"),language:val("lc"),instructions:val("in")},files.slice());
  it.status="pending_approval";S.items.unshift(it);note("generated","Content generated",pn+" draft is ready.");note("awaiting","Post awaiting approval",pn);save();res.innerHTML=resHtml(it);bind();toast("Draft ready")}catch(e){res.innerHTML=`<div class="card"><b>Generation failed.</b> ${esc(e.message)}</div>`}busy=false}
function bind(){const q=(s,f)=>{const e=$(s);if(e)e.onclick=f};
 document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll("[data-a]").forEach(e=>e.onclick=()=>act(e.dataset.a,e.dataset.id));document.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>{const it=item(e.dataset.id),p=it.product_name,L=it.caption.split("\n")[1]||"",W={short:`${p}. Made for you.`,playful:`POV: you finally found ${p} 😍\n${L}`,premium:`Introducing ${p}. Crafted with care for those who notice the details.`};it.caption=W[e.dataset.v];if(it.status==="approved")it.status="pending_approval";save();const g=$("#res .ig");if(g)g.outerHTML=ig(it);toast("Variant applied")});
 const v=S.view,b=S.biz;
 if(v==="onboard"){q("#bk",()=>{S.step--;render()});q("#nx",()=>{if(S.step===1){if(!val("bn").trim()||!val("iu").trim()||!val("ds").trim())return toast("Fill in all required fields");Object.assign(b,{business_name:val("bn").trim(),instagram_username:val("iu").trim().replace("@",""),category:val("ct"),description:val("ds").trim()})}else Object.assign(b,{brand_colors:[val("c1"),val("c2")],tone:val("tn"),target_audience:val("ta"),language:val("lc")});S.step++;save();render()});
  q("#demo",()=>{S.step=1;save();toast("Business saved (Demo Mode)");go("dash")});q("#conn",()=>toast("Real Instagram connection needs the backend OAuth flow. Not available in this build."))}
 if(v==="studio"){const dz=$("#dz"),fi=$("#fi");dz.onclick=()=>fi.click();dz.onkeydown=e=>{if(e.key==="Enter")fi.click()};fi.onchange=()=>{addFiles(fi.files);fi.value=""};dz.ondragover=e=>{e.preventDefault();dz.classList.add("h")};dz.ondragleave=()=>dz.classList.remove("h");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("h");addFiles(e.dataTransfer.files)};drawFiles();$("#fl").onclick=e=>{const i=e.target.dataset.rm;if(i!=null){files.splice(i,1);drawFiles()}};q("#gen",generate)}
 if(v==="content")$("#ff").onchange=e=>{S.filter=e.target.value;render()};
 if(v==="cal"){const f=()=>{const it=item(val("sp"));if(!it)return null;return it};
  q("#sch",()=>{const it=f(),d=val("sd");if(!it||!d)return toast("Pick a post and a date/time");const iso=toISO(d,val("stz"));if(new Date(iso)<new Date())return toast("Pick a future time");it.scheduled_at=iso;it.status="scheduled";S.biz.timezone=val("stz");note("scheduled","Post scheduled",it.product_name+" · "+fmt(iso));save();toast("Scheduled");render()});q("#pn2",()=>{const it=f();if(it)act("publish",it.id)})}
 if(v==="sec")q("#scan",async()=>{toast("Running sample assessment…");await wait(700);runScan();render()});
 if(v==="notif")q("#mr",()=>{S.notes.forEach(n=>n.read=true);save();render()});
 if(v==="set"){q("#sv",()=>{Object.assign(b,{business_name:val("bn"),instagram_username:val("iu"),tone:val("tn"),timezone:val("tz")});save();toast("Settings saved");render()});q("#rs",()=>{if(confirm("Clear all demo data?")){try{localStorage.removeItem("bp")}catch(e){}location.reload()}})}}
function off(tz,d){const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-d.getTime()}
function toISO(l,tz){const g=new Date(l+":00Z");return new Date(g.getTime()-off(tz,g)).toISOString()}
render();
</script></body></html>
